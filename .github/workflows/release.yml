name: Release Build

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write

jobs:
  desktop-win:
    name: Build Windows installer
    runs-on: windows-latest
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pi-gui/pnpm-lock.yaml

      - name: Install
        working-directory: pi-gui
        run: pnpm install --frozen-lockfile

      - name: Typecheck desktop
        working-directory: pi-gui
        run: pnpm --filter @pi-gui/desktop typecheck

      - name: Build desktop
        working-directory: pi-gui/apps/desktop
        run: pnpm run build

      - name: Package Windows installer (NSIS)
        shell: bash
        working-directory: pi-gui/apps/desktop
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm exec electron-builder --win nsis \
            --publish never \
            "-c.extraMetadata.version=${VERSION}"

      - name: Upload installer to release
        shell: bash
        working-directory: pi-gui/apps/desktop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${GITHUB_REF_NAME}" \
            "release/pi-gui-${VERSION}-x64.exe" \
            --clobber

      - name: Generate SLSA subject (SHA256 digest)
        shell: bash
        working-directory: pi-gui/apps/desktop
        id: hash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT="release/pi-gui-${VERSION}-x64.exe"
          echo "digests=$(sha256sum "${ARTIFACT}" | base64 -w0)" >> "${GITHUB_OUTPUT}"

  slsa-provenance:
    name: Generate SLSA3 provenance
    permissions:
      actions: read
      id-token: write
      contents: write
    needs: [desktop-win]
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.desktop-win.outputs.digests }}"
      upload-assets: true
